name: CI

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install -U pip
        python -m pip install build setuptools_scm wheel

    - name: Build
      run: |
        python -m build

    - name: Upload dist
      if: github.repository == 'SanDisk-Open-Source/pyvcd'
      uses: actions/upload-artifact@v7
      with:
        name: pyvcd-dist
        path: "dist/*"

  publish:
    if: github.repository == 'SanDisk-Open-Source/pyvcd'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/pyvcd
    permissions:
      id-token: write

    steps:
    - name: Retrieve package
      uses: actions/download-artifact@v8
      with:
        name: pyvcd-dist
        path: "dist"

    - name: Display dist files
      run: ls -Rl

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install uv
      run: |
        python -m pip install -U pip
        python -m pip install uv==0.12.3

    # - name: Test Publish package
    #   run: uv publish --publish-url https://test.pypi.org/legacy/

    - name: Publish package
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      run: uv publish --trusted-publishing always

  test:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python builds older than 3.10 are not published for the newer
          # runner images, so those versions pin the oldest image available.
          - python-version: '3.7'
            runs-on: ubuntu-22.04
          - python-version: '3.8'
            runs-on: ubuntu-22.04
          - python-version: '3.9'
            runs-on: ubuntu-22.04
          - python-version: '3.10'
            runs-on: ubuntu-latest
          - python-version: '3.11'
            runs-on: ubuntu-latest
          - python-version: '3.12'
            runs-on: ubuntu-latest
          - python-version: '3.13'
            runs-on: ubuntu-latest
          - python-version: '3.14'
            runs-on: ubuntu-latest
          - python-version: 'pypy-3.7'
            runs-on: ubuntu-22.04
          - python-version: 'pypy-3.9'
            runs-on: ubuntu-latest
          - python-version: 'pypy-3.10'
            runs-on: ubuntu-latest
          - python-version: 'pypy-3.11'
            runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install -U pip
        python -m pip install -e . -r requirements.txt

    - name: Test
      run: |
        make test

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install -U pip
        python -m pip install -e . -r requirements.txt
    - name: Lint
      run: |
        make lint

  coverage:
    if: github.repository == 'SanDisk-Open-Source/pyvcd'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install -U pip
        python -m pip install -e . -r requirements.txt coveralls
    - name: Coverage
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        make coverage && coveralls
