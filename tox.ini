[tox]
env_list = py310, py311, py312, py313, py314, pypy3, ruff, mypy, docs
requires =
    tox>=4
    tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
# The lockfile is not checked in, so let uv resolve and write one as needed.
uv_sync_locked = false
dependency_groups = test
commands = pytest {posargs}

[testenv:ruff]
runner = uv-venv-lock-runner
dependency_groups = lint
skip_install = true
commands =
    ruff check .
    ruff format --check .

[testenv:mypy]
runner = uv-venv-lock-runner
dependency_groups = type
commands = mypy

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = docs
commands = sphinx-build -b html docs docs/_build/html
